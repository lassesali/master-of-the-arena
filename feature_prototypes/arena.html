function drawGladiator(ctx, w, h, datalist, gladiator, radius)
{

	number = gladiator.getSijaintiRataSektorilla();
	vari = getTeamColor( gladiator.getTallinNimi() ); 
	//var radius = h / 2 - 5;
	var cCenterx = w / 2;
	var cCentery = h / 2;
	var center = {
		x: cCenterx,
		y: cCentery
	};
	var total = 0;
	for(x=0; x < datalist.length; x++) { total += datalist[x]; }; 
	var lastend=0;
	var offset = Math.PI / 2;
  
	for(var x=0; x < datalist.length; x++)
	{
		var thispart = datalist[x]; 
		var arcsector = Math.PI * (2 * thispart / total);

		if (x==number)
		{

			var startDegrees = ( lastend - offset ) * (180/Math.PI)+90;
			var endDegrees = ( lastend + arcsector - offset ) * (180/Math.PI)+90;

			degree = startDegrees + (endDegrees-startDegrees)/2;
			var point = getPointAt(center, radius, degree);

			
			
			ctx.beginPath();
			ctx.moveTo(point.x, point.y);
			ctx.arc(point.x, point.y, 5, 0 , 2 * Math.PI, false);
			ctx.closePath();
			ctx.fillStyle = vari;
			ctx.fill();			

			ctx.beginPath();
			ctx.arc(point.x, point.y, 5, 0 , 2 * Math.PI, false);
			ctx.closePath();
			ctx.fillStyle = 'black';
			ctx.stroke();
			
		} 

		lastend += arcsector;	
	} 
}

function msToTime(s) {

  function addZ(n) {
    return (n<10? '0':'') + n;
  }


  function addZZ(n) {
    return (n<100? '0':'') + n;
  }


  var ms = s % 1000;
  s = (s - ms) / 1000;
  var secs = s % 60;
  s = (s - secs) / 60;
  var mins = s % 60;
  var hrs = (s - mins) / 60;

  

  return addZ(hrs) + ':' + addZ(mins) + ':' + addZ(secs) + '.' + addZ(addZZ(ms));
}

	{
	    var temp;
		if ( kierrosNumero > maxKierrosNumero )
		{
		  temp = maxKierrosNumero;
		}
		else
		{
		  temp = kierrosNumero;
		}
		if ( temp == maxKierrosNumero )
		{
		  return "FINAL LAP";
		}
		else
		{
		  return temp + ' / ' + maxKierrosNumero;
		 }
	}
	
	this.getKierrosLuku = function()
	{
	    var temp = kierrosNumero; // palautetaan myös ruutulippukierroksen jälkeiset kierrokset

function isInsideSector(point, center, sectorStart, sectorEnd, radiusSquared) {
	var relPoint = {
	  x: point.x - center.x,
	  y: point.y - center.y
	};

	return !areClockwise(sectorStart, relPoint) &&
		   areClockwise(sectorEnd, relPoint) &&
		   isWithinRadius(relPoint, radiusSquared);
}

function areClockwise(v1, v2) {
	return -v1.x*v2.y + v1.y*v2.x > 0;
}

function isWithinRadius(v, radiusSquared) {
	return v.x*v.x + v.y*v.y <= radiusSquared;
}

function piirraYmpyra(ctx,radius,color,mode)
{
	ctx.beginPath();
	ctx.moveTo(256,256);
	ctx.arc(256, 256, radius, 0 , 2 * Math.PI, false);
	ctx.closePath();
	ctx.fillStyle = color;
	if (mode == 0)
	{
		ctx.stroke();
	}
	else
	{
		ctx.fill();
	}
}

function pie(ctx, w, h, datalist, radius)
{
  //var radius = h / 2 - 5;
  var centerx = w / 2;
  var centery = h / 2;
  var total = 0;
  for(x=0; x < datalist.length; x++) { total += datalist[x]; }; 
  var lastend=0;
  var offset = Math.PI / 2;
  for(x=0; x < datalist.length; x++)
  {
    var thispart = datalist[x]; 
    ctx.beginPath();
    if ( x < colist.length )
	{
		ctx.fillStyle = colist[x];
	}
	else
	{
		if ( x % 2 == 0 )
		{
			ctx.fillStyle = 'darkgray';
		}
		else
		{
			ctx.fillStyle = 'white';

		}
		
	}
	
    ctx.moveTo(centerx,centery);
    var arcsector = Math.PI * (2 * thispart / total);
    ctx.arc(centerx, centery, radius, lastend - offset, lastend + arcsector - offset, false);
    ctx.lineTo(centerx, centery);
	//ctx.fillStyle = 'black';
    ctx.fill();
    ctx.closePath();		
    lastend += arcsector;	
  }
}

function getPointAt(center, radius, angle) {
    // Please note that the angle is given in radians;
    // if given in degrees uncomment the line below
    angle *= Math.PI / 180;
    return {x: center.x + Math.sin(Math.PI - angle) * radius,
        y: center.y + Math.cos(Math.PI - angle) * radius};
}

function distanceBetween( point1, point2 )
{
	var xs = 0;
	var ys = 0;
	 
	xs = point2.x - point1.x;
	xs = xs * xs;
	 
	ys = point2.y - point1.y;
	ys = ys * ys;
	 
	return Math.sqrt( xs + ys );
}

function angle(center, p1) {
    var p0 = {x: center.x, y: center.y - Math.sqrt(Math.abs(p1.x - center.x) * Math.abs(p1.x - center.x)
            + Math.abs(p1.y - center.y) * Math.abs(p1.y - center.y))};
    return (2 * Math.atan2(p1.y - p0.y, p1.x - p0.x)) * 180 / Math.PI;
}

function pieceOfPie(ctx, w, h, datalist, number, radius)
{
	//var radius = h / 2 - 5;
	var centerx = w / 2;
	var centery = h / 2;
	var total = 0;
	for(x=0; x < datalist.length; x++) { total += datalist[x]; }; 
	var lastend=0;
	var offset = Math.PI / 2;
  
	for(var x=0; x < datalist.length; x++)
	{
		var thispart = datalist[x]; 

			ctx.beginPath();

			if ( x < colist.length )
			{
				ctx.fillStyle = colist[x];
			}
			else
			{
				if ( x % 2 == 0 )
				{
					ctx.fillStyle = 'darkgray';
				}
				else
				{
					ctx.fillStyle = 'white';

				}
				
			}
			
			ctx.moveTo(centerx,centery);
			var arcsector = Math.PI * (2 * thispart / total);

		if (x==number)
		{
			ctx.arc(centerx, centery, radius, lastend - offset, lastend + arcsector - offset, false);
			ctx.lineTo(centerx, centery);

			var startDegrees = ( lastend - offset ) * (180/Math.PI)+90;
			var endDegrees = ( lastend + arcsector - offset ) * (180/Math.PI)+90;


			ctx.fill();
			ctx.closePath();

			var glad = haeGladiaattoriSektorilta(gladiaattoritLista, valittuSektori);
			if (glad != false)
			{
				drawGladiator(ctx, 512,512, datalist, glad, 170);
			}		
		

		} 
		else 
		{
			ctx.closePath();		
		}
		lastend += arcsector;	
	} 
}

function checkMouseOnPie(ctx, w, h, datalist, angle, radius, mousePoint)
{

	//var radius = h / 2 - 5;
	var cCenterx = w / 2;
	var cCentery = h / 2;
	var total = 0;
	for(var px=0; px < datalist.length; px++) { total += datalist[px]; }; 
	var lastend=0;
	var offset = Math.PI / 2;
  
	for(var cx=0; cx < datalist.length; cx++)
	{
		var thispart = datalist[cx]; 
		var arcsector = Math.PI * (2 * thispart / total);
		var startDegrees = Math.round ( ( lastend - offset ) * (180/Math.PI)+90 );
		var endDegrees = Math.round ( ( lastend + arcsector - offset ) * (180/Math.PI)+90 );
        




		ctx.beginPath();

		ctx.moveTo(cCenterx,cCentery);

		var center = {
			x: cCenterx,
			y: cCentery
		};
		
		var ax = findPosX( document.getElementById('areena') );
		var ay = findPosY( document.getElementById('areena') );

		
		var distance = distanceBetween(center,mousePoint);
		if ( angle >= startDegrees && angle <= endDegrees && valittuSektori != cx && distance>=160 && distance<=180 )
		{
           
			if ( valittuSektori != undefined )
			{
				ctx.closePath();
				pieceOfPie(ctx, 512, 512, datalist, valittuSektori, 180); 
				ctx.beginPath();
				ctx.moveTo(cCenterx,cCentery);
			}


			valittuSektori = cx;



			ctx.arc(cCenterx, cCentery, radius, lastend - offset, lastend + arcsector - offset, false);
			ctx.lineTo(cCenterx, cCentery);
			ctx.fillStyle = 'red';
			ctx.fill();
			ctx.closePath();

			degree = startDegrees + (endDegrees-startDegrees)/2;
			var point = getPointAt(center, radius-8, degree);

			ctx.beginPath();
			ctx.moveTo(point.x, point.y);
			ctx.arc(point.x, point.y, 5, 0 , 2 * Math.PI, false);
			ctx.closePath();
			ctx.fillStyle = 'rgba(0,0,0,0.33)';
			ctx.fill();
			
			piirraYmpyra(ctx,159,'rgb(128,128,128)',1);

			var glad = haeGladiaattoriSektorilta(gladiaattoritLista, valittuSektori);
			if (glad != false)
			{
				drawGladiator(ctx, 512,512, datalist, glad, 170);
				point.x = point.x + ax;
				point.y = point.y + ay;
				raporttiGladiaattori(datalist, glad,point);
			}
			else
			{
				raporttiGladiaattori(false,false,false);
			}
			
			
		}
		else if ( (distance<160 || distance>180) && valittuSektori != undefined && valittuSektori != false )
		{
			raporttiGladiaattori(false,false,false);
			pieceOfPie(ctx, 512, 512, datalist, valittuSektori, 180); 		
			piirraYmpyra(ctx,159,'rgb(128,128,128)',1);
			valittuSektori = undefined;
		}
		
		ctx.closePath();

		lastend += arcsector;	
	} 
	





	//piirraYmpyra(ctx,160,'rgb(0,0,0)',1);
	
}

function findPosX(obj)
  {
    var curleft = 0;
    if(obj.offsetParent)
        while(1) 
        {
          curleft += obj.offsetLeft;
          if(!obj.offsetParent)
            break;
          obj = obj.offsetParent;
        }
    else if(obj.x)
        curleft += obj.x;
    return curleft;
  }

  function findPosY(obj)
  {
    var curtop = 0;
    if(obj.offsetParent)
        while(1)
        {
          curtop += obj.offsetTop;
          if(!obj.offsetParent)
            break;
          obj = obj.offsetParent;
        }
    else if(obj.y)
        curtop += obj.y;
    return curtop;
  }
