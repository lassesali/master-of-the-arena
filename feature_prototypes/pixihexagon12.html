	window.onload = function()
	{
		//adding the event listerner for Mozilla
		if(window.addEventListener)
			document.addEventListener('DOMMouseScroll', moveObject, false);

		//for IE/OPERA etc
		document.onmousewheel = moveObject;
	}

	function moveObject(event)
	{
	
		var delta = 0;

		if (!event) event = window.event;

		// normalize the delta
		if (event.wheelDelta) {

			// IE & Opera
			delta = event.wheelDelta / 60;

		} else if (event.detail) {

			// W3C
			delta = -event.detail / 2;
		}


		
		addZoom( delta/10 );
	}
	
	function getMousePos(canvas, evt) 
	{
		var rect = canvas.getBoundingClientRect();
		return {
		  x: evt.clientX - rect.left,
		  y: evt.clientY - rect.top
		};
	}

	Array.prototype.last = Array.prototype.last || function(count) {
		count = count || 1;
		var length = this.length;
		if (count <= length) {
			return this[length - count];
		} else {
			return null;
		}
	};

	//reittiolion konstruktori
	function Path() {

	    var path = [];
		var maxLength = 5;
		
		this.addToPath = function(param)
		{
			if ( path.length == maxLength )
			{
				var temp = path.last();
				if (temp != null )
				{
					if ( !(temp[0] == param[0] && temp[1] == param[1]) )
					{						
						path.shift();
						path.push(param);
					}
				}
			}
			else
			{
				var temp = path.last();
				if (temp != null )
				{
					if ( !(temp[0] == param[0] && temp[1] == param[1]) )
					{						
						path.push(param);
					}
				} 
				else 
				{
					path.push(param);

				}
				
			}
			
			
			
		}
		
		this.length = function()
		{
			return path.length;
		}
		
		this.getFromPath = function()
		{
			return path.pop();
		}
		
		this.report = function()
		{
			return path;
		}
		
		this.get = function()
		{
			return path;
		}
		
		this.printPathToTextarea = function(tekstikentta)
		{
			tekstikentta.value = "";
			
			for (i=0; i < path.length; i++)
			{
				tekstikentta.value += path[i]+"\n";
			}
			
			
		}
		
		this.init = function(param)
		{
			path = param;
		}

	}

		// draw a line
		graphics.lineStyle(5, 0xFF0000);

		for (i=0; tempPath.length()>0; i++)
		{

	function getCenter(x,y)
	{
	    
		var centerx = parseInt(getLeftBorder(x,y) + ((getRightBorder(x,y) - getLeftBorder(x,y)) / 2)); 
		var centery = parseInt(getTopBorder(x,y) + ((getBottomBorder(x,y) - getTopBorder(x,y)) / 2));
		return new Array (centerx, centery);
	}	  
	function getTopBorder(x,y)
	{
		var reunat = getBorders(x,y);
		return Math.floor( reunat[0] );
	}	 
	function getBottomBorder(x,y)
	{
		var reunat = getBorders(x,y);
		return Math.floor( reunat[1] );
	}	  
	function getLeftBorder(x,y)
	{
		var reunat = getBorders(x,y);
		return Math.floor( reunat[2] );
	}	 
	function getRightBorder(x,y)
	{
		var reunat = getBorders(x,y);
		return Math.floor( reunat[3] );
	}	 
	  
	function getBorders(x,y)
	{
		var topBorder;
		var bottomBorder;
		var leftBorder;
		var rightBorder;

		if (y % 2 == 0)
		{
			if (x == 1)
			{
				if ( y == 2 ) 
				{
					topBorder = d*(a+c);
					bottomBorder = d*(2*c+2*a+a);
					leftBorder = b;
					rightBorder = 2*b+b;
				}
				else
				{
					if ( y == 4)
					{
						var item =  3*c+4*a;
					}
					else
					{
						var item =  (y-1)*c+y*a;
					}
					topBorder = d*(item-a);
					bottomBorder = d*(item + c + a);
					leftBorder = b;
					rightBorder = 2*b+b;
				}
			}
			else
			{
				if ( y == 2 ) 
				{
					topBorder = d*(a+c);
					bottomBorder = d*(2*c+2*a+a);
					leftBorder = (x-1)*2*b + b;
					rightBorder = (x-1)*2*b + 2*b+b;
				}
				else
				{
					var item =  (y-1)*c+y*a; 
					topBorder = d*(item-a);
					bottomBorder = d*(item + c + a);
					leftBorder = (x-1)*2*b + b;
					rightBorder = (x-1)*2*b + 2*b+b;
				}
			}
		}
		else
		{
			if ( y == 1)	
			{
				if (x == 1)
				{
					topBorder = 0;
					bottomBorder = d*(2*c);
					leftBorder = 0;
					rightBorder = 2*b;
				}
				else
				{
					topBorder = 0;
					bottomBorder = d*(2*c);
					leftBorder = (x-1)*2*b;
					rightBorder = (x-1)*2*b + 2*b;
				}
			}
			else
			{
				if (x == 1)
				{
					if (y == 3)
					{
						var item =  (y-1)*2*c-a;
					}
					else 
					{
						var item =  (y-1)*c+y*a;
					}
					topBorder = d*(item-a);
					bottomBorder = d*(item + c + a);
					leftBorder = 0;
					rightBorder = 2*b;
				}
				else
				{
					if (y == 3)
					{
						var item =  (y-1)*2*c-a;
					}
					else 
					{
						var item =  (y-1)*c+y*a;
					}
					topBorder = d*(item-a);
					bottomBorder = d*(item + c + a);
					leftBorder = (x-1)*2*b;
					rightBorder = (x-1)*2*b + 2*b; 
				}
			}		  
		}

		leveys=rightBorder-leftBorder;
		pituus=bottomBorder-topBorder;
		topBorder=topBorder-pituus/2;
		bottomBorder=bottomBorder-pituus/2;
		leftBorder=leftBorder-leveys/2;
		rightBorder=rightBorder-leveys/2;
                //console.log("topBorder, bottomBorder, leftBorder, rightBorder: " + topBorder +","+ bottomBorder +","+ leftBorder +","+ rightBorder );
		
		return new Array( topBorder, bottomBorder, leftBorder, rightBorder  );	  
	}

	function is_in_triangle (px,py,ax,ay,bx,by,cx,cy)
	{

		//credit: http://www.blackpawn.com/texts/pointinpoly/default.html

		var v0 = [cx-ax,cy-ay];
		var v1 = [bx-ax,by-ay];
		var v2 = [px-ax,py-ay];

		var dot00 = (v0[0]*v0[0]) + (v0[1]*v0[1]);
		var dot01 = (v0[0]*v1[0]) + (v0[1]*v1[1]);
		var dot02 = (v0[0]*v2[0]) + (v0[1]*v2[1]);
		var dot11 = (v1[0]*v1[0]) + (v1[1]*v1[1]);
		var dot12 = (v1[0]*v2[0]) + (v1[1]*v2[1]);

		var invDenom = 1/ (dot00 * dot11 - dot01 * dot01);

		var u = (dot11 * dot02 - dot01 * dot12) * invDenom;
		var v = (dot00 * dot12 - dot01 * dot02) * invDenom;

		return ((u >= 0) && (v >= 0) && (u + v < 1));
	}
