	function componentFromStr(numStr, percent) {
		var num = Math.max(0, parseInt(numStr, 10));
		return percent ?
			Math.floor(255 * Math.min(100, num) / 100) : Math.min(255, num);
	}

	// Funktio vastaanottaa parametrina joko "RGB(R,G,B)" tai "RGBA(R,G,B,A)".
	// Funktio palauttaa taulukon, jonka alkiot ovat: 1) RGB-arvo muodossa RGB(R,G,B) ja 2) Alpha-arvo.
	function rgbaToRgb(color) {
		
		var iColor = color;
		iColor = iColor.replace(' ', '');
		iColor = iColor.replace('(', '');
		iColor = iColor.replace(')', '');
		iColor = iColor.replace('rgba', '');
		iColor = iColor.replace('rgb', '');
		iColor = iColor.replace(' ', '');
        iColor = iColor.split(',');

		if ( !iColor[3] )		
		{
			var IDs = new Array(1);
			IDs[0] = color; // return RGB(R,G,B)
			IDs[1] = "1.0"; // return Alpha
			return IDs;
		}
		else
		{
			var IDs = new Array(1);
			IDs[0] = "rgb(" + iColor[0] + "," + iColor[1] + "," + iColor[2] + ")"; // return RGB(R,G,B)
			IDs[1] = iColor[3]; // return Alpha
			return IDs;
		}
	}
	
	
	// Funktio vastaanottaa parametrina joko "RGB(R,G,B)" tai "RGBA(R,G,B,A)".
	// Funktio palauttaa taulukon, jonka alkiot ovat: 1) RGB-arvo heksadesimaalimuodossa ja 2) Alpha-arvo.
	function rgbToHex(rgb) {
	
		var result = rgbaToRgb(rgb);
		
		rgb = result[0];
		var alpha = result[1];

		var rgbRegex = /^rgb\(\s*(-?\d+)(%?)\s*,\s*(-?\d+)(%?)\s*,\s*(-?\d+)(%?)\s*\)$/;

		var result, r, g, b, hex = new Array(1);
		if ( (result = rgbRegex.exec(rgb)) ) {
			r = componentFromStr(result[1], result[2]);
			g = componentFromStr(result[3], result[4]);
			b = componentFromStr(result[5], result[6]);

			hex[0] = "0x" + (0x1000000 + (r << 16) + (g << 8) + b).toString(16).slice(1);
			hex[1] = alpha;
		}

		return hex;
	}

function draw()
{

	if (piirra[0] == "load" )
	{
		var myCanvas = document.getElementById('kuva');

			{

				ctx.fillRect(0,0,768,256);

				// ## pixi.js ##
				var graphics = new PIXI.Graphics();

				graphics.beginFill( rgbToHex("rgb(128,128,128)")[0] );

				// set the line style to have a width of 0 and set the color to rgb(0,0,0)
				graphics.lineStyle( 0, rgbToHex("rgb(0,0,0)")[0] );
